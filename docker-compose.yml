services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: grc
      POSTGRES_PASSWORD: grc
      POSTGRES_DB: grc
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/neo4jpass
    ports: ["7474:7474", "7687:7687"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
  localstack:
    image: localstack/localstack
    environment:
      SERVICES: sqs
    ports: ["4566:4566"]
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports: ["5000:5000"]
  prometheus:
    image: prom/prometheus
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
  api:
    build: ./apps/api
    env_file: .env.example
    ports: ["8000:8000"]
    depends_on: [postgres, qdrant, neo4j, redis, minio, localstack]
  worker:
    build: ./apps/worker
    env_file: .env.example
    depends_on: [postgres, qdrant, neo4j, redis, minio, localstack]

volumes:
  pgdata:
